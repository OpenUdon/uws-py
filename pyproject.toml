[project]
name = "openudon-uws"
version = "0.1.0"
description = "Python validator for the Udon Workflow Specification (UWS) 1.x"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "OpenUdon" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Typing :: Typed",
]
dependencies = [
  "jsonschema>=4.23,<5",
  "referencing>=0.35",
  "PyYAML>=6.0.2,<7",
]

[project.urls]
Repository = "https://github.com/OpenUdon/uws-py"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "mypy>=1.13",
  "ruff>=0.8",
  "types-PyYAML>=6.0",
  "types-jsonschema>=4.23",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openudon_uws"]

[tool.hatch.build.targets.sdist]
include = ["src", "vendor", "tests", "tools", "scripts", "docs", "README.md", "PLAN.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src", "tests", "scripts"]

[[tool.mypy.overrides]]
module = ["referencing.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]
